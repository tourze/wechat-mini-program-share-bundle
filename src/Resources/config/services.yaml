services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    public: false

  WechatMiniProgramShareBundle\Controller\:
    resource: '../../Controller/'
  WechatMiniProgramShareBundle\Repository\:
    resource: '../../Repository/'
  WechatMiniProgramShareBundle\Service\:
    resource: '../../Service/'
    public: true
  WechatMiniProgramShareBundle\EventSubscriber\:
    resource: '../../EventSubscriber/'
    public: true
  WechatMiniProgramShareBundle\Procedure\:
    resource: '../../Procedure/'
    public: true

  wechat-mini-program-share.hashids:
    class: Hashids\Hashids
    factory: ['WechatMiniProgramShareBundle\Service\HashidsFactory', 'createHashids']
